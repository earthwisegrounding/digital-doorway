# Contact-form mailer for digitaldoorwaymarketing.com (Cloudflare Worker).
#   cd api
#   echo "re_…" | npx wrangler secret put RESEND_API_KEY   # once; never commit the key
#   npx wrangler deploy                                     # prints the workers.dev URL
name = "digital-doorway-mail"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Where form submissions go (comma-separated).
NOTIFY_TO = "steevreeves@gmail.com,marvreeves@gmail.com,info@digitaldoorwaymarketing.com"
# Sender. Must be on a domain verified in Resend; until then Resend's test sender is used.
MAIL_FROM = "Digital Doorway Marketing <hello@digitaldoorwaymarketing.com>"
# Send the visitor a confirmation copy ("yes"/"no"). Needs a verified sending domain.
AUTO_REPLY = "yes"
ALLOWED_ORIGINS = "https://digitaldoorwaymarketing.com,https://www.digitaldoorwaymarketing.com,https://earthwisegrounding.github.io"
# Square sales → admin alert + client thank-you. Only payments at this location count.
# Online payment via Square is switched OFF (invoices are emailed instead). To turn it back on:
#   set CHECKOUT_ENABLED = "yes" here, PAY_ONLINE = true in script.js, and re-enable the Square webhook subscription.
CHECKOUT_ENABLED = "no"
SQUARE_LOCATION_ID = "LWTA04YK02TTT"
SQUARE_NOTIFICATION_URL = "https://digital-doorway-mail.angie-tatum-api.workers.dev/square-webhook"
# Secret: SQUARE_WEBHOOK_SIGNATURE_KEY  (from the webhook subscription; `npx wrangler secret put SQUARE_WEBHOOK_SIGNATURE_KEY`)

[[kv_namespaces]]
binding = "SEEN"
id = "dc4aa4eb26384eccb766b65ac8b41173"
